[versions]
java = "21"
kotlin = "2.3.0"
moddev = "2.0.126"
loom = "1.14-SNAPSHOT"
dokka = "2.1.0"
licenser = "0.7.5"
ksp = "2.3.4"
autoservice-google = "1.1.1"
autoservice-ksp = "1.2.0"

minecraft = "1.21.1"
minecraftRange = "[1.21.1, 1.21.2)"

# The version of ParchmentMC that is used, see https://parchmentmc.org/docs/getting-started#choose-a-version for new versions
parchment = "2024.11.17"
parchmentMC = "1.21.1"

neoforge = "21.1.209"
neoforgeRange = "[21.1.209, 22-)"
## This is the version of minecraft that the 'common' project uses, you can find a list of all versions here
## https://projects.neoforged.net/neoforged/neoform
neoForm = "1.21.1-20240808.144430"
klf = "2.11.1-k2.3.0-3.0+neoforge"
klfRange = "[2.11.1-k2.3.0-3.0+neoforge, )"

fabricLoader = "0.18.3"
fabricApi = "0.116.7+1.21.1"
flk = "1.13.8+kotlin.2.3.0"

mixin = "0.8.5"
mixinExtras = "0.5.0"

[libraries]
minecraft = { group = "com.mojang", name = "minecraft", version.ref = "minecraft" }
fabricLoader = { group = "net.fabricmc", name = "fabric-loader", version.ref = "fabricLoader" }
fabricApi = { group = "net.fabricmc.fabric-api", name = "fabric-api", version.ref = "fabricApi" }
flk = { group = "net.fabricmc", name = "fabric-language-kotlin", version.ref = "flk" }
klf = { group = "dev.nyon", name = "KotlinLangForge", version.ref = "klf" }
mixin = { group = "org.spongepowered", name = "mixin", version.ref = "mixin" }
mixinExtras-common = { group = "io.github.llamalad7", name = "mixinextras-common", version.ref = "mixinExtras" }
autoservice-google = { module = "com.google.auto.service:auto-service", version.ref="autoservice-google" }
autoservice-ksp = { module = "dev.zacsweers.autoservice:auto-service-ksp", version.ref="autoservice-ksp" }

[plugins]
kotlin = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
dokka = { id = "org.jetbrains.dokka", version.ref = "dokka" }
moddev = { id = "net.neoforged.moddev", version.ref = "moddev" }
loom = { id = "fabric-loom", version.ref = "loom" }
licenser = { id = "net.neoforged.licenser", version.ref = "licenser" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }